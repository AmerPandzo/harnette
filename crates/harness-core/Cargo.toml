[package]
name = "harness-core"
version = "0.1.0"
edition = "2024"
description = "Harness core: agent adapters, policy, journal. No UI code."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
