[package]
name = "harnette-core"
version = "0.1.0"
edition = "2024"
description = "Harnette core: agent adapters, policy, journal. No UI code."

[dependencies]
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
toml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
toml_edit = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
